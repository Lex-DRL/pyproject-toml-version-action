name: '🔬 Test'

on:
  workflow_dispatch:  # Allows to manually run the workflow, too
  workflow_call:  # Make the workflow reusable in other workflows
    inputs:
      concurrency_group_id:
        description: >-
          Should be set to some non-empty string - to differentiate from direct test-workflow triggers
          + to let callers define their own groups.
        required: false
        type: string
        default: 'called'  # Empty for other trigger events (in this workflow)

# ====== CONCURRENCY ======

# Prevent multiple simultaneous builds for the same version:
concurrency:
  # group: test-${{ inputs.concurrency_group_id }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  group: test-${{ inputs.concurrency_group_id }}-${{ github.event_name }}
  # cancel-in-progress: false  # the second pending run is put into a queue, the third one is cancelled (GitHub limitation)
  cancel-in-progress: ${{ inputs.concurrency_group_id == '' }}  # Cancel running for direct triggers

# ========= JOBS =========

permissions:
  contents: read

jobs:

  test:
    name: "Test"
    # needs: [build]

    # Just to be nice with forked repos made solely for a PR - let's run only if:
    # - it's an original repo and NOT a fork
    # - or it was triggered manually
    # - or called (reused) from another workflow
    if: |
      github.repository_owner == 'Lex-DRL' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Prevent stuck jobs

    steps:
#    - name: 🐍 Set up Python
#      uses: actions/setup-python@v7
#      with:
#        python-version: "3.x"
#        cache: 'pip'  # Enable built-in pip caching

    - name: ♻️ Check out code
      uses: actions/checkout@v7
      # with:
      #   fetch-depth: 0  # Critical for changelog + first-release support

    - name: "Extract version 🔢"
      id: extract-version
      uses: Lex-DRL/pyproject-toml-version-action@main
      # with:
      #   toml-file: 'pyproject.toml'
      #   python-version: '3.x'
      #   skip-python-setup: true

    - name: "Test print"
      run: |
        echo 'Extracted version: ${{ steps.extract-version.outputs.version }}'
